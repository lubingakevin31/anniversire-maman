  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #070a11;
      --bg-card: #0f1626;
      --bg-chat-bubble: #172136;
      --gold-main: #d4af37;
      --gold-light: #f3e5ab;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --font-title: 'Cinzel', serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-body);
      padding: 1.5rem 1rem;
      min-height: 100vh;
    }

    /* BARRE SUPÉRIEURE / BOUTON RETOUR */
    .top-bar {
      max-width: 700px;
      margin: 0 auto 2rem auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, var(--gold-main), var(--gold-light));
      color: #000;
      padding: 0.6rem 1.2rem;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.85rem;
      text-decoration: none;
      text-transform: uppercase;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-back:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.4);
    }

    .page-title {
      font-family: var(--font-title);
      color: var(--gold-main);
      font-size: 1.2rem;
      text-align: right;
    }

    /* CONTENEUR DES AUDIOS */
    .audio-container {
      max-width: 700px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    /* CARTE MESSAGE VOCAL (STYLE WHATSAPP) */
    .audio-card {
      background: var(--bg-card);
      border: 1px solid rgba(212, 175, 55, 0.15);
      border-radius: 16px;
      padding: 1rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s, border-color 0.2s;
    }

    .audio-card:hover {
      transform: translateY(-2px);
      border-color: rgba(212, 175, 55, 0.4);
    }

    /* AVATAR ROND DE LA PERSONNE */
    .avatar {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--gold-main);
      flex-shrink: 0;
    }

    /* CONTENU DE L'AUDIO */
    .audio-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      min-width: 0; /* Évite les débordements CSS */
    }

    .sender-name {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--gold-light);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* LECTEUR AUDIO CUSTOM / NATIVE RESPONSIVE */
    audio {
      width: 100%;
      height: 36px;
      border-radius: 20px;
      outline: none;
    }

    /* Ajustement spécifique du lecteur sur chrome/webkit */
    audio::-webkit-media-controls-panel {
      background-color: var(--bg-chat-bubble);
    }

    /* RESPONSIVE DESIGN */
    @media (max-width: 480px) {
      body {
        padding: 1rem 0.5rem;
      }

      .top-bar {
        flex-direction: row;
        align-items: center;
      }

      .page-title {
        font-size: 1rem;
      }

      .avatar {
        width: 45px;
        height: 45px;
      }

      .audio-card {
        padding: 0.8rem;
        gap: 0.75rem;
      }
    }
        /* ==========================================
       8. FOOTER & ANIMATIONS
       ========================================== */
    footer {
      text-align: center;
      padding: 2rem 1.5rem;
      background: #04060a;
      border-top: 1px solid rgba(212, 175, 55, 0.15);
      color: var(--text-muted);
    }
  </style>
</head>
